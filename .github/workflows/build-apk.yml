name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install family app icon when uploaded
        run: |
          if [ -f app/src/main/icon-source.png ] || [ -f app/src/main/file_0000000045108209bd69570a702918c5.png ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            cp "$(test -f app/src/main/icon-source.png && echo app/src/main/icon-source.png || echo app/src/main/file_0000000045108209bd69570a702918c5.png)" app/src/main/res/drawable-nodpi/app_icon.png
            sed -i 's|@android:drawable/ic_menu_compass|@drawable/app_icon|' app/src/main/AndroidManifest.xml
          fi
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify generated APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: random-travel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
